<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="./popup.js" defer></script>
    <title>Cerolingo</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <a
      href="https://ancymon.dev/Cerolingo"
      target="_blank"
      rel="noopener"
      id="title"
    >
      <img id="logo" src="../../assets/title.svg" alt="Cerolingo" />
    </a>

    <p id="tagline">100% free &amp; open-source</p>

    <div class="extension-links">
      <a
        href="https://chromewebstore.google.com/detail/cerolingo/apgkphplddmjkoogmoijendkdjaaeiii"
        target="_blank"
        rel="noopener"
        >Chrome Store</a
      >

      <a
        href="https://addons.mozilla.org/firefox/addon/cerolingo/"
        target="_blank"
        rel="noopener"
        >Firefox Add-ons</a
      >
    </div>

    <a
      href="https://github.com/ancym0n/Cerolingo"
      target="_blank"
      rel="noopener"
      id="github"
    >
      <img src="../../assets/github.svg" alt="" />
      <span>Source Code</span>
    </a>

    <div class="review-section">
      <p class="review-heading">Leave a review</p>
      <div class="review-links">
        <a
          href="https://chromewebstore.google.com/detail/cerolingo/apgkphplddmjkoogmoijendkdjaaeiii/reviews"
          target="_blank"
          rel="noopener"
          >Chrome</a
        >
        <a
          href="https://addons.mozilla.org/firefox/addon/cerolingo/reviews/"
          target="_blank"
          rel="noopener"
          >Firefox</a
        >
      </div>
    </div>

    <footer id="credit">
      <span>Made by</span>
      <a href="https://github.com/ancym0n" target="_blank" rel="noopener"
        >ancymon</a
      >
      <span>·</span>
      <a
        href="https://github.com/ancym0n/Cerolingo/issues"
        target="_blank"
        rel="noopener"
        class="muted"
        >Report a bug</a
      >
      <span>·</span>
      <span id="version"></span>
    </footer>
  </body>
</html>
